name: hello world

on:
  workflow_dispatch:  # This allows manual triggering
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Test JavaScript code
        run: |
          node -e "const utils = require('./sample.js'); console.log('Testing modulo function:', utils.modulo(10, 3) === 1 ? 'PASS' : 'FAIL');"
          echo "All tests passed!"

